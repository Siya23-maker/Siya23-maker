<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="400" viewBox="0 0 1200 400">
<title>Smart-X Detecto: sensors to priority queue to ASP.NET Core API to SQLite and AquaVerse</title>
<defs>
  <clipPath id="rr"><rect width="1200" height="400" rx="16"/></clipPath>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity="0.03"/></pattern>
  <style>
  .t { font: 600 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e6edf3 }
  .s { font: 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #8b949e }
  .h { font: 700 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #8b949e; letter-spacing: 2.5px }
  .m { font: 600 12px Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace; fill: #e6edf3 }
  .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5 }
  .wire { fill: none; stroke: #30363d; stroke-width: 2; stroke-dasharray: 6 6 }

  @keyframes A { 0%,40% { transform: translateX(0) } 50%,100% { transform: translateX(-62px) } }
  @keyframes U { 0%,18% { opacity: 0; transform: translate(0,-30px) } 28%,40% { opacity: 1; transform: translate(0,0) }
                  52% { opacity: 1; transform: translate(186px,0) } 66% { opacity: 1; transform: translate(186px,0) }
                  78%,100% { opacity: 0; transform: translate(250px,0) } }
  @keyframes F { 0%,40% { opacity: 1; transform: translateX(0) } 50%,100% { opacity: 0; transform: translateX(-20px) } }
  @keyframes flash { 0%,70% { opacity: 0 } 76% { opacity: .9 } 100% { opacity: 0 } }
  @keyframes ring { 0%,72% { r: 6; opacity: 0 } 74% { opacity: .9 } 100% { r: 70; opacity: 0 } }
  @keyframes swim { 0% { transform: translateX(0) scaleX(1) } 49% { transform: translateX(150px) scaleX(1) } 50% { transform: translateX(150px) scaleX(-1) } 99% { transform: translateX(0) scaleX(-1) } 100% { transform: translateX(0) scaleX(1) } }
  @keyframes dash { to { stroke-dashoffset: -24 } }
  @keyframes bub { from { transform: translateY(0); opacity: .7 } to { transform: translateY(-70px); opacity: 0 } }
  @keyframes blink { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  @keyframes row { 0%,74% { opacity: 0 } 80%,100% { opacity: 1 } }
  .wire { animation: dash 1s linear infinite }
  .qa { animation: A 6s ease-in-out infinite }
  .qu { animation: U 6s ease-in-out infinite }
  .qf { animation: F 6s ease-in-out infinite }
  .flash { animation: flash 6s ease-out infinite }
  .ring { animation: ring 6s ease-out infinite }
  .fish { transform-box: fill-box; transform-origin: center; animation: swim 9s ease-in-out infinite }
  .bub { animation: bub 3s ease-in infinite }
  .blink { animation: blink 1.6s ease-in-out infinite }
  .row { animation: row 6s ease-out infinite }
</style>
</defs>
<g clip-path="url(#rr)">
<rect width="1200" height="400" fill="#0d1117"/><rect width="1200" height="400" fill="url(#grid)"/>

<text x="32" y="44" class="h">HOW IT WORKS · LIVE FLOW</text>
<text x="1168" y="44" class="s" text-anchor="end">Every reading is queued, prioritised, stored and acted on in real time</text>

<!-- sensors -->
<text x="92" y="92" class="t" text-anchor="middle">Sensors</text>
<g><circle cx="92" cy="140" r="22" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/><circle cx="92" cy="140" r="6" fill="#58a6ff" class="blink" style="animation-delay:0.0s"/><path d="M78 126 a20 20 0 0 0 0 28 M106 126 a20 20 0 0 1 0 28" fill="none" stroke="#58a6ff" stroke-opacity="0.5" stroke-width="1.5"/></g><g><circle cx="92" cy="215" r="22" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/><circle cx="92" cy="215" r="6" fill="#58a6ff" class="blink" style="animation-delay:0.4s"/><path d="M78 201 a20 20 0 0 0 0 28 M106 201 a20 20 0 0 1 0 28" fill="none" stroke="#58a6ff" stroke-opacity="0.5" stroke-width="1.5"/></g><g><circle cx="92" cy="290" r="22" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/><circle cx="92" cy="290" r="6" fill="#58a6ff" class="blink" style="animation-delay:0.8s"/><path d="M78 276 a20 20 0 0 0 0 28 M106 276 a20 20 0 0 1 0 28" fill="none" stroke="#58a6ff" stroke-opacity="0.5" stroke-width="1.5"/></g>

<!-- wires -->
<path id="p1" class="wire" d="M116 140 C 190 140, 200 215, 268 215"/>
<path id="p2" class="wire" d="M116 215 L 268 215"/>
<path id="p3" class="wire" d="M116 290 C 190 290, 200 215, 268 215"/>
<path id="p4" class="wire" d="M560 215 L 632 215"/>
<path id="p5" class="wire" d="M842 215 C 880 215, 880 120, 916 120"/>
<path id="p6" class="wire" d="M842 215 C 880 215, 880 300, 916 300"/>
<circle r="4.5" fill="#58a6ff"><animateMotion dur="2.2s" begin="0.00s" repeatCount="indefinite"><mpath xlink:href="#p1" href="#p1"/></animateMotion></circle><circle r="4.5" fill="#58a6ff"><animateMotion dur="2.2s" begin="1.10s" repeatCount="indefinite"><mpath xlink:href="#p1" href="#p1"/></animateMotion></circle><circle r="4.5" fill="#58a6ff"><animateMotion dur="1.8s" begin="0.00s" repeatCount="indefinite"><mpath xlink:href="#p2" href="#p2"/></animateMotion></circle><circle r="4.5" fill="#58a6ff"><animateMotion dur="1.8s" begin="0.90s" repeatCount="indefinite"><mpath xlink:href="#p2" href="#p2"/></animateMotion></circle><circle r="4.5" fill="#58a6ff"><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite"><mpath xlink:href="#p3" href="#p3"/></animateMotion></circle><circle r="4.5" fill="#58a6ff"><animateMotion dur="2.6s" begin="1.30s" repeatCount="indefinite"><mpath xlink:href="#p3" href="#p3"/></animateMotion></circle>
<circle r="4.5" fill="#58a6ff"><animateMotion dur="1.4s" begin="0.00s" repeatCount="indefinite"><mpath xlink:href="#p4" href="#p4"/></animateMotion></circle><circle r="4.5" fill="#58a6ff"><animateMotion dur="1.4s" begin="0.70s" repeatCount="indefinite"><mpath xlink:href="#p4" href="#p4"/></animateMotion></circle><circle r="4.5" fill="#3fb950"><animateMotion dur="2.0s" begin="0.00s" repeatCount="indefinite"><mpath xlink:href="#p5" href="#p5"/></animateMotion></circle><circle r="4.5" fill="#3fb950"><animateMotion dur="2.0s" begin="1.00s" repeatCount="indefinite"><mpath xlink:href="#p5" href="#p5"/></animateMotion></circle><circle r="4.5" fill="#3fb950"><animateMotion dur="2.0s" begin="0.00s" repeatCount="indefinite"><mpath xlink:href="#p6" href="#p6"/></animateMotion></circle><circle r="4.5" fill="#3fb950"><animateMotion dur="2.0s" begin="1.00s" repeatCount="indefinite"><mpath xlink:href="#p6" href="#p6"/></animateMotion></circle>

<!-- queue -->
<rect x="268" y="150" width="292" height="130" rx="12" class="box"/>
<text x="414" y="138" class="t" text-anchor="middle">Priority queue</text>
<text x="414" y="266" class="s" text-anchor="middle">urgent readings jump the line</text>
<g>
  <g class="qf" ><rect x="298" y="192" width="56" height="34" rx="7" fill="#58a6ff" fill-opacity="0.18" stroke="#58a6ff"/><text x="326" y="213.5" text-anchor="middle" class="m" style="fill:#58a6ff">R-101</text></g>
  <g class="qa" ><rect x="360" y="192" width="56" height="34" rx="7" fill="#58a6ff" fill-opacity="0.18" stroke="#58a6ff"/><text x="388" y="213.5" text-anchor="middle" class="m" style="fill:#58a6ff">R-102</text></g>
  <g class="qa" ><rect x="422" y="192" width="56" height="34" rx="7" fill="#58a6ff" fill-opacity="0.18" stroke="#58a6ff"/><text x="450" y="213.5" text-anchor="middle" class="m" style="fill:#58a6ff">R-103</text></g>
  <g class="qa" ><rect x="484" y="192" width="56" height="34" rx="7" fill="#58a6ff" fill-opacity="0.18" stroke="#58a6ff"/><text x="512" y="213.5" text-anchor="middle" class="m" style="fill:#58a6ff">R-104</text></g>
  <g class="qu" ><rect x="298" y="192" width="56" height="34" rx="7" fill="#ff7b72" fill-opacity="0.18" stroke="#ff7b72"/><text x="326" y="213.5" text-anchor="middle" class="m" style="fill:#ff7b72">URGENT</text></g>
</g>

<!-- API -->
<rect x="632" y="160" width="210" height="110" rx="12" class="box"/>
<rect x="632" y="160" width="210" height="110" rx="12" fill="#ff7b72" class="flash"/>
<text x="737" y="203" class="t" text-anchor="middle">ASP.NET Core</text>
<text x="737" y="223" class="t" text-anchor="middle">Web API</text>
<text x="737" y="248" class="s" text-anchor="middle">C# · MVC · xUnit tested</text>

<!-- SQLite -->
<rect x="916" y="70" width="252" height="100" rx="12" class="box"/>
<text x="940" y="98" class="t">Reading history</text>
<text x="940" y="116" class="s">SQLite · Entity Framework Core</text>
<g class="row"><rect x="940" y="128" width="204" height="24" rx="5" fill="#ff7b72" fill-opacity="0.15"/><text x="950" y="145" class="m" style="fill:#ff7b72">R-105  urgent  saved ✓</text></g>

<!-- AquaVerse -->
<defs><linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b4fb3"/><stop offset="1" stop-color="#042146"/></linearGradient>
<clipPath id="tank"><rect x="916" y="240" width="252" height="128" rx="12"/></clipPath></defs>
<text x="1042" y="230" class="t" text-anchor="middle">AquaVerse simulation</text>
<g clip-path="url(#tank)">
  <rect x="916" y="240" width="252" height="128" fill="url(#water)"/>
  <path d="M916 262 q 21 -8 42 0 t 42 0 t 42 0 t 42 0 t 42 0 t 42 0 V240 H916Z" fill="#58a6ff" fill-opacity="0.25"/>
  <g class="fish"><path d="M950 310 q 22 -16 44 0 q -22 16 -44 0z M994 310 l 14 -10 v 20z" fill="#ffa657"/><circle cx="960" cy="307" r="2.2" fill="#0d1117"/></g>
  <g style="animation-delay:-4s" class="fish"><path d="M990 345 q 14 -10 28 0 q -14 10 -28 0z M1018 345 l 9 -6 v 12z" fill="#7ee787"/></g>
  <circle cx="1120" cy="360" r="4" fill="none" stroke="#a5d6ff" class="bub" style="animation-delay:0s"/><circle cx="1135" cy="360" r="3" fill="none" stroke="#a5d6ff" class="bub" style="animation-delay:1.2s"/><circle cx="1110" cy="360" r="2.5" fill="none" stroke="#a5d6ff" class="bub" style="animation-delay:2.1s"/><circle cx="940" cy="360" r="3" fill="none" stroke="#a5d6ff" class="bub" style="animation-delay:0.6s"/>
  <circle cx="1042" cy="304" r="6" fill="none" stroke="#ff7b72" stroke-width="2.5" class="ring"/>
  <rect x="916" y="240" width="252" height="128" fill="#ff7b72" fill-opacity="0.25" class="flash"/>
</g>
<rect x="916" y="240" width="252" height="128" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>
