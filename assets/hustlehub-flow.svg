<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="360" viewBox="0 0 1200 360">
<title>HustleHub+: request passing rate limit, Helmet, sanitisation, JWT and role checks before reaching MongoDB</title>
<defs>
  <clipPath id="rr"><rect width="1200" height="360" rx="16"/></clipPath>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity="0.03"/></pattern>
  <style>
  .t { font: 600 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e6edf3 }
  .s { font: 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #8b949e }
  .h { font: 700 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #8b949e; letter-spacing: 2.5px }
  .m { font: 600 12px Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace; fill: #e6edf3 }
  .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5 }
  .wire { fill: none; stroke: #30363d; stroke-width: 2; stroke-dasharray: 6 6 }

  @keyframes dash { to { stroke-dashoffset: -24 } }
  .wire { animation: dash 1s linear infinite }
  @keyframes ok { 0%,100% { stroke: #30363d; fill-opacity: 0 } 3% { stroke: #3fb950; fill-opacity: .18 } 14% { stroke: #3fb950; fill-opacity: .18 } 22% { stroke: #30363d; fill-opacity: 0 } }
  @keyframes bad { 0%,100% { stroke: #30363d; fill-opacity: 0 } 3% { stroke: #ff7b72; fill-opacity: .22 } 16% { stroke: #ff7b72; fill-opacity: .22 } 24% { stroke: #30363d; fill-opacity: 0 } }
  @keyframes show { 0% { opacity: 0 } 4%,16% { opacity: 1 } 22%,100% { opacity: 0 } }
  @keyframes cap { 0%,48% { opacity: 1 } 50%,98% { opacity: 0 } 100% { opacity: 1 } }
  @keyframes cap2 { 0%,48% { opacity: 0 } 50%,98% { opacity: 1 } 100% { opacity: 0 } }
  .cap { animation: cap 8s linear infinite }
  .cap2 { animation: cap2 8s linear infinite }
</style>
</defs>
<g clip-path="url(#rr)">
<rect width="1200" height="360" fill="#0d1117"/><rect width="1200" height="360" fill="url(#grid)"/>

<text x="32" y="44" class="h">HOW A REQUEST IS PROTECTED</text>
<text x="1168" y="44" class="s" text-anchor="end" >Security is built into every layer of the Express API</text>
<text x="600" y="92" class="t cap" text-anchor="middle" style="fill:#3fb950">✓ A valid request passes every check and reaches the database</text>
<text x="600" y="92" class="t cap2" text-anchor="middle" style="fill:#ff7b72">✗ A brute-force login attempt is stopped at the first layer (HTTP 429)</text>
<path id="h1" class="wire" d="M200 175 L 1000 175"/>
<rect x="40" y="130" width="160" height="90" rx="12" class="box"/>
<text x="120" y="172" class="t" text-anchor="middle">React app</text>
<text x="120" y="192" class="s" text-anchor="middle">Vite · HTTPS</text>
<rect x="1000" y="130" width="160" height="90" rx="12" class="box"/>
<text x="1080" y="172" class="t" text-anchor="middle">MongoDB</text>
<text x="1080" y="192" class="s" text-anchor="middle">gigs · bookings · ZAR</text>
<rect x="260" y="130" width="128" height="90" rx="12" class="box"/>
<rect x="260" y="130" width="128" height="90" rx="12" fill="#3fb950" fill-opacity="0" stroke-width="2" style="animation: ok 8s linear 0.60s infinite"/>
<text x="324.0" y="170" class="t" text-anchor="middle">Rate limit</text>
<text x="324.0" y="190" class="s" text-anchor="middle" style="font-size:11.5px">5 tries, then 429</text><rect x="402" y="130" width="128" height="90" rx="12" class="box"/>
<rect x="402" y="130" width="128" height="90" rx="12" fill="#3fb950" fill-opacity="0" stroke-width="2" style="animation: ok 8s linear 1.15s infinite"/>
<text x="466.0" y="170" class="t" text-anchor="middle">Helmet</text>
<text x="466.0" y="190" class="s" text-anchor="middle" style="font-size:11.5px">CSP · HSTS · nosniff</text><rect x="544" y="130" width="128" height="90" rx="12" class="box"/>
<rect x="544" y="130" width="128" height="90" rx="12" fill="#3fb950" fill-opacity="0" stroke-width="2" style="animation: ok 8s linear 1.70s infinite"/>
<text x="608.0" y="170" class="t" text-anchor="middle">Sanitise</text>
<text x="608.0" y="190" class="s" text-anchor="middle" style="font-size:11.5px">blocks NoSQL injection</text><rect x="686" y="130" width="128" height="90" rx="12" class="box"/>
<rect x="686" y="130" width="128" height="90" rx="12" fill="#3fb950" fill-opacity="0" stroke-width="2" style="animation: ok 8s linear 2.25s infinite"/>
<text x="750.0" y="170" class="t" text-anchor="middle">JWT + bcrypt</text>
<text x="750.0" y="190" class="s" text-anchor="middle" style="font-size:11.5px">secure login</text><rect x="828" y="130" width="128" height="90" rx="12" class="box"/>
<rect x="828" y="130" width="128" height="90" rx="12" fill="#3fb950" fill-opacity="0" stroke-width="2" style="animation: ok 8s linear 2.80s infinite"/>
<text x="892.0" y="170" class="t" text-anchor="middle">Role check</text>
<text x="892.0" y="190" class="s" text-anchor="middle" style="font-size:11.5px">3 user roles</text><rect x="260" y="130" width="128" height="90" rx="12" fill="#ff7b72" fill-opacity="0" stroke-width="2" style="animation: bad 8s linear 4.60s infinite"/>
<g style="opacity:0; animation: show 8s linear 4.60s infinite"><rect x="290.0" y="230" width="68" height="26" rx="13" fill="#ff7b72" fill-opacity="0.2" stroke="#ff7b72"/><text x="324.0" y="248" class="m" text-anchor="middle" style="fill:#ff7b72">429</text></g>
<g style="opacity:0; animation: show 8s linear 3.4s infinite"><rect x="1046" y="230" width="68" height="26" rx="13" fill="#3fb950" fill-opacity="0.2" stroke="#3fb950"/><text x="1080" y="248" class="m" text-anchor="middle" style="fill:#3fb950">200 OK</text></g>
<!-- green request -->
<circle cx="0" cy="0" r="8" fill="#3fb950">
  <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;1;1;1" keyTimes="0;0.45;0.5;1" calcMode="linear"><mpath xlink:href="#h1" href="#h1"/></animateMotion>
  <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.46;0.5;1" dur="8s" repeatCount="indefinite"/>
</circle>
<!-- red request -->
<circle cx="0" cy="0" r="8" fill="#ff7b72" opacity="0">
  <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0;0.09;0.09;0.09" keyTimes="0;0.5;0.58;0.7;1" calcMode="linear"><mpath xlink:href="#h1" href="#h1"/></animateMotion>
  <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.51;0.68;0.72;1" dur="8s" repeatCount="indefinite"/>
</circle>
<text x="600" y="300" class="s" text-anchor="middle">Tested end to end: 64/64 back-end (Jest) · 38/38 front-end (Vitest) · 95 API assertions (Newman) · 0 failures</text>
<rect x="420" y="316" width="360" height="8" rx="4" fill="#21262d"/>
<rect x="420" y="316" width="360" height="8" rx="4" fill="#3fb950" style="transform-box: fill-box; transform-origin: left; animation: grow 2.4s ease-out .3s both"/>
<style>@keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }</style>

</g>
<rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="16" fill="none" stroke="#30363d" stroke-width="1.5"/>
</svg>